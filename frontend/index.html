  let randomWords = [];

<head>
  <title>Game Round</title>
</head>
<body>
  <button id="redBtn">RED WIN</button>
  <p id="scoresRed"></p>

  <button id="blackBtn">BLACK WIN</button>
  <p id="scoresBlack"></p>

  <button id="resetBtn">RESET</button>
  <p id="scoresReset"></p>

  <!--<button id="pickBtn" onclick="chooseGamemode()">4 player</button>-->
  <!--<p id = "4playerText"></p>-->

<p id="output"></p>

  <script>
    color = ""; 
    function clickButton(color){
      if (color === "red"){
        document.getElementById("redBtn").addEventListener("click", () => {
        updateScores(color); 
        display(color);
        });
      }
      else if (color === "black"){
        document.getElementById("blackBtn").addEventListener("click", () => {
        updateScores(color);
        display(color);
        });
      }
      else{
        document.getElementById("resetBtn").addEventListener("click", () => {
        updateScores(color);
        display(color);
        display(color);
        });
      }
    }

function updateScores(color){
  if (color === "red"){
    for (let player of players.red){
      player.score += 5;
    };
  }
  else if (color === "black"){
    for (let player of players.black){
      player.score += 5;
    };
  }
  else{
    for (let player of players.red){
      player.score = 0;
    };
    for (let player of players.black){
      player.score = 0;
    };
  }
}

function display(color){
  if (color === "red"){
    for (let n = 0; n < players[color].length / 2; n++){
      document.getElementById("scoresRed").innerText = `${players[color][n].name}: ${players[color][n].role}: ${players[color][n].score}`; 
    }
  }
  else{
    for (let n = 0; n < players[color].length / 2; n++){
      document.getElementById("scoresBlack").innerText = `${players[color][n].name}: ${players[color][n].role}: ${players[color][n].score}`; 
    }
  }
}

function askQuestions() {  
  let num = prompt("Enter number of players: ");
  if (num % 4 === 0){
    for (let i = 0; i < num / 2; i++) {
      if (i % 2 === 0){
        let nameCurr = prompt("Enter name for red player " + (i + 1));
        addPlayer("red", "guesser", nameCurr); 
      }
      else{
        let nameCurr = prompt("Enter name for red player " + (i + 1));
        addPlayer("red", "explainer", nameCurr); 
      }
    }   
    for (let k = 0; k < num / 2; k++) {

      if (k % 2 === 0){
        let nameCurr2 = prompt("Enter name for black player " + (k + 1));
        addPlayer("black", "guesser", nameCurr2); 
      }
      else{
        let nameCurr2 = prompt("Enter name for black player " + (k + 1));
        addPlayer("black", "explainer", nameCurr2); 
      }
    } 
  }
  else{
    alert("Enter 4, 8, or 12");
  }
}

function addPlayer(team, role, name) {
  players[team].push({
    role: role,
    name: name,
    score: 0
  });
}

  let players = {
  red: [],
  black: []
};
  
  askQuestions();     
  display("red");
  display("black");
  clickButton("red")
  clickButton("black")
  clickButton("resetBtn")

    
  </script>
</body>

</html>
