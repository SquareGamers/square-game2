<p id="rand"></p>

<script>
	
  function startGameEasyBasic() {
    randomWords = [];
    for (let i = 0; i < 10; i++) {
       randomWords.push(listEasyBasicWords[i]);
    }
    
    let rWord = randomWords[Math.floor(Math.random() * randomWords.length)];
   
    
    function printWord() {
    	return rWord;
    }
    document.getElementById("rand").innerText = printWord();

  }

  function startGameMediumBasic() {
    randomWords = [];
    for (let i = 0; i < 10; i++) {
       randomWords.push(listMediumBasicWords[i]);
    }
    
    let rWord = randomWords[Math.floor(Math.random() * randomWords.length)];
   
    
    function printWord() {
    	return rWord;
    }
    document.getElementById("rand").innerText = printWord();
  }

  function startGameHardBasic() {
    randomWords = [];
    for (let i = 0; i < 10; i++) {
       randomWords.push(listHardBasicWords[i]);
    }
    
    let rWord = randomWords[Math.floor(Math.random() * randomWords.length)];
   
    
    function printWord() {
    	return rWord;
    }
    document.getElementById("rand").innerText = printWord();
  }
  
  

  let randomWords = [];
  let listEasyBasicWords = ["Brick", "Jump", "Cloud", "Flame", "Stone", "Crisp", "Glow", "Blink", "Grin", "Sketch"]
  let listMediumBasicWords = ["Adventure", "Cathedral", "Whisper", "Paradox", "Melody", "Science", "Circus", "Radiant", "Horizon", "Vibration"];
  let listHardBasicWords = ["California", "Opportunity", "Imagination", "Uncontrollability", "Celebration", "Responsibility", "Himalayas", "Individuality", "Information", "Misinterpretation"];

	
    
</script>

<button onclick="startGameEasyBasic()">Easy (Basic)</button>
<button onclick="startGameMediumBasic()">Medium (Basic)</button>

<head>
  <title>Game Round</title>
</head>
<body>
  <button id="redBtn">End Round RED</button>
  <p id="scoresRed"></p>

  <button id="blackBtn">End Round BLACK</button>
  <p id="scoresBlack"></p>

  <button id="resetBtn">Reset</button>
  <p id="scoresReset"></p>

  <input type="text" id="username" placeholder="Enter your name">
  <button onclick="addName()">Submit</button>

  <button id="pickBtn" onclick="chooseGamemode()">4 player</button>
  <p id = "4playerText"></p>

<p id="output"></p>

  <script>

    document.getElementById("redBtn").addEventListener("click", () => {
      increaseRed(); 
      document.getElementById("scoresRed").innerText = displayRed();
    });

    document.getElementById("blackBtn").addEventListener("click", () => {
      increaseBlack();
      document.getElementById("scoresBlack").innerText = displayBlack();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      resetRed();
      resetBlack();
      document.getElementById("scoresRed").innerText = displayRed();
      document.getElementById("scoresBlack").innerText = displayBlack();  
    });

function increaseRed(){
  if (chooseGamemode() === 4){
  players.guesserRed.score += 5;
  players.explainerRed.score += 5;
  }
  else{
    players.guesserRed.score += 5;
    players.explainerRed.score += 5;
    players.guesserRed2.score += 5;
    players.explainerRed2.score += 5;
  }
}

function increaseBlack(){
  if (chooseGamemode() === 4){
  players.guesserBlack.score += 5;
  players.explainerBlack.score += 5;
  }
  else{
    players.guesserBlack.score += 5;
    players.explainerBlack.score += 5;
    players.guesserBlack2.score += 5;
    players.explainerBlack2.score += 5;
  }
}

function resetRed(){
  if (chooseGamemode() === 4){
    players.guesserRed.score = 0;
    players.explainerRed.score = 0;
  }
  else{
    players.guesserRed.score = 0;
    players.explainerRed.score = 0;
    players.guesserRed2.score = 0;
    players.explainerRed2.score = 0;
  }
}

function resetBlack(){
  if (chooseGamemode() === 4){
    players.guesserBlack.score = 0;
    players.explainerBlack.score = 0;
  }
  else{
    players.guesserBlack.score = 0;
    players.explainerBlack.score = 0;
    players.guesserBlack2.score = 0;
    players.explainerBlack2.score = 0;
  }
}

function displayRed(){
  if (players.length === 4){
    return `${players.guesserRed.name}: ${players.guesserRed.score} | ${players.explainerRed.name}: ${players.explainerRed.score}`;

  }
  else{
    return `${players.guesserRed.name}: ${players.guesserRed.score} | ${players.explainerRed.name}: ${players.explainerRed.score} || ${players.guesserRed2.name}: ${players.guesserRed2.score} | ${players.explainerRed2.name}: ${players.explainerRed2.score}`;
  }
}

function displayBlack(){
  if (players.length === 4){
    return `${players.guesserBlack.name}: ${players.guesserBlack.score} | ${players.explainerBlack.name}: ${players.explainerBlack.score}`;
  }
  else{
    return `${players.guesserBlack.name}: ${players.guesserBlack.score} | ${players.explainerBlack.name}: ${players.explainerBlack.score} || ${players.guesserBlack2.name}: ${players.guesserBlack2.score} | ${players.explainerBlack2.name}: ${players.explainerBlack2.score}`;
  }
}

if (chooseGamemode() === 4){
  let players = [
  { role: "guesserRed", name: null, score: 0 },
  { role: "explainerRed", name: null, score: 0 },
  { role: "guesserBlack", name: null, score: 0 },
  { role: "explainerBlack", name: null, score: 0 }
];
}
else{
  let players = [
  { role: "guesserRed",   name: null, score: 0 },
  { role: "explainerRed", name: null, score: 0 },
  { role: "guesserBlack", name: null, score: 0 },
  { role: "explainerBlack", name: null, score: 0 },
  { role: "guesserRed2",   name: null, score: 0 },
  { role: "explainerRed2", name: null, score: 0 },
  { role: "guesserBlack2", name: null, score: 0 },
  { role: "explainerBlack2", name: null, score: 0 }
];

}

    function askQuestions() {
  let gamemode = prompt("4 player or 8 player?");
  
  if (gamemode==="4") {  // only continue if answered
    for (i = 0; i < 4; i++) {
      let name = prompt("Enter name for player " + i);
      alert("Got it: Player " + i + " is " + name + ".");
      players[i].name = name; 
    }
  } 
  else if (gamemmode==="8"){
    for (i = 0; i < 8; i++) {
      let name = prompt("Enter name for player " + i);
      alert("Got it: Player " + i + " is " + name + ".");
      players[i].name = name;
    }
  }
  else {
    alert("Please enter either '4 player' or '8 player'.");
  }
}
