  <script>
    type = ""; 
    button = ""; 
    function clickButton(type, button){
      if (type === "increase"){
        if (button === "redBtn"){
          document.getElementById("redBtn").addEventListener("click", () => {
            updateScores(type, button); 
          document.getElementById("scoresRed").innerText = display(button);
          });
        }
        else{
          document.getElementById("blackBtn").addEventListener("click", () => {
            updateScores(type, button);
          document.getElementById("scoresBlack").innerText = display(button);
           });
        }
      }
      else{
        document.getElementById("resetBtn").addEventListener("click", () => {
          updateScores(type, button);
          updateScores(type, button);
        document.getElementById("scoresRed").innerText = display(button);
        document.getElementById("scoresBlack").innerText = display(button);  
    });
      }
    }

function updateScores(type, button){
  if (type === "increase"){
    if (button === "redBtn"){
      for (let player of players.red){
        player.score += 5;
      };
    }
    else{
      for (let player of players.black){
        player.score += 5;
      };
    }
  }
  else{
    for (let player of players.red){
      player.score = 0;
    };
    for (let player of players.black){
      player.score = 0;
    };
  }
}

function display(button){
  if (button === "redBtn"){
    return `${players.red[0].name}: ${players.red[0].score} | ${players.red[1].name}: ${players.red[1].score}`;
  }
  else{
    return `${players.black[0].name}: ${players.black[0].score} | ${players.black[1].name}: ${players.black[1].score}`;
  }
}

let players = {
red: [
  { role: "guesser", name: null, score: 0 },
  { role: "explainer", name: null, score: 0 }
  ],
black: [
  { role: "guesser", name: null, score: 0 },
  { role: "explainer", name: null, score: 0 }
]};

clickButton("increase", "redBtn")
