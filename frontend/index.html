<p id="rand"></p>

<script>
	
  function startGameEasyBasic() {
    randomWords = [];
    for (let i = 0; i < 10; i++) {
       randomWords.push(listEasyBasicWords[i]);
    }
    
    let rWord = randomWords[Math.floor(Math.random() * randomWords.length)];
   
    
    function printWord() {
    	return rWord;
    }
    document.getElementById("rand").innerText = printWord();

  }

  function startGameMediumBasic() {

    for (let i = 0; i < 10; i++) {

    }

    }

  }

  function startGameHardBasic() {

    }
    
    let rWord = randomWords[Math.floor(Math.random() * randomWords.length)];
   
    
    function printWord() {

    }
    document.getElementById("rand").innerText = printWord();
  }
  
  

  let randomWords = [];
  let listEasyBasicWords = ["Brick", "Jump", "Cloud", "Flame", "Stone", "Crisp", "Glow", "Blink", "Grin", "Sketch"]
  let listMediumBasicWords = ["Adventure", "Cathedral", "Whisper", "Paradox", "Melody", "Science", "Circus", "Radiant", "Horizon", "Vibration"];
  let listHardBasicWords = ["California", "Opportunity", "Imagination", "Uncontrollability", "Celebration", "Responsibility", "Himalayas", "Individuality", "Information", "Misinterpretation"];

<button onclick="startGameEasyBasic()">Easy (Basic)</button>
<button onclick="startGameMediumBasic()">Medium (Basic)</button>
<button onclick="startGameHardBasic()">Hard (Basic)</button>

<head>
  <title>Game Round</title>
</head>
<body>
  <button id="redBtn">RED WIN</button>
  <p id="scoresRed"></p>

  <button id="blackBtn">BLACK WIN</button>
  <p id="scoresBlack"></p>

  <button id="resetBtn">RESET</button>
  <p id="scoresReset"></p>

  <!--<button id="pickBtn" onclick="chooseGamemode()">4 player</button>-->
  <!--<p id = "4playerText"></p>-->

<p id="output"></p>

  <script>
    button = ""; 
    function clickButton(button){
      if (button === "redBtn"){
        document.getElementById("redBtn").addEventListener("click", () => {
        updateScores(button); 
        display(button);
        });
      }
      else if (button === "blackBtn"){
        document.getElementById("blackBtn").addEventListener("click", () => {
        updateScores(button);
        display(button);
        });
      }
      else{
        document.getElementById("resetBtn").addEventListener("click", () => {
        updateScores(button);
        display("redBtn");
        display("blackBtn");
        });
      }
    }

function updateScores(button){
  if (button === "redBtn"){
    for (let player of players.red){
      player.score += 5;
    };
  }
  else if (button === "blackBtn"){
    for (let player of players.black){
      player.score += 5;
    };
  }
  else{
    for (let player of players.red){
      player.score = 0;
    };
    for (let player of players.black){
      player.score = 0;
    };
  }
}

function display(button){
  if (button === "redBtn"){
    document.getElementById("scoresRed").innerText = `${players.red[0].name}: ${players.red[0].score} | ${players.red[1].name}: ${players.red[1].score}`;
  }
  else{
    document.getElementById("scoresBlack").innerText = `${players.black[0].name}: ${players.black[0].score} | ${players.black[1].name}: ${players.black[1].score}`;
  }
}

function askQuestions() {  
    for (i = 0; i < 2; i++) {
      let nameCurr = prompt("Enter name for red player " + i);
      players.red[i].name = nameCurr; 
    }   
    for (i = 0; i < 2; i++) {
      let nameCurr2 = prompt("Enter name for black player " + i);
      players.black[i].name = nameCurr2; 
    } 
}

  let players = {
    red: [
      { role: "guesser", name: null, score: 0 },
      { role: "explainer", name: null, score: 0 }
      ],
    black: [
      { role: "guesser", name: null, score: 0 },
      { role: "explainer", name: null, score: 0 }
    ]};
  
  askQuestions();     
  display("redBtn");
  display("blackBtn");
  clickButton("redBtn")
  clickButton("blackBtn")
  clickButton("resetBtn")

    
  </script>
</body>
