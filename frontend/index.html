let streakCountRed = 0;
let streakCountBlack = 0;
function updateScores(color) {
  if (color === "red") {
    if (streakCountRed < 5) {
      streakCountRed++;
    }
    streakCountBlack = 0;
    players.red.forEach(p => p.score += (3 * streakCountRed));
    display("red");
  } else if (color === "black") {
    if (streakCountBlack < 5) {
      streakCountBlack++;
    }
    streakCountRed = 0;
    players.black.forEach(p => p.score += (3 * streakCountBlack));
    display("black");
  } else if (color === "reset") {
    streakCountRed = 0;
    streakCountBlack = 0;
    players.red.forEach(p => p.score = 0);
    players.black.forEach(p => p.score = 0);
    display("red");
    display("black");
  }
}


function display(color) {
  const container = color === "red"
    ? document.getElementById("scoresRed")
    : color === "black"
      ? document.getElementById("scoresBlack")
      : null;

  if (!container) return; // bail if color invalid

  container.innerHTML = ""; // clear

  const team = players[color];
  if (!Array.isArray(team)) return;

  team.forEach((player, index) => {
    const p = document.createElement("p");
    p.id = `${color}-player-${index}`;
    p.textContent = `${color} ${player.role} ${player.name}: ${player.score}`;
    container.appendChild(p);
  });

}

    function askQuestions() {
      let half = Math.floor(num / 2); // integer division

      for (let i = 0; i < half; i++) {
        const nameCurr = document.getElementById("player" + i).value.trim();
        if (i < Math.floor(half / 2)) {
          addPlayer("red", "guesser", nameCurr);
        } else {
          addPlayer("red", "explainer", nameCurr);
        }
      }

      for (let k = 0; k < num - half; k++) {
        const nameCurr = document.getElementById("player" + (half + k)).value.trim();
        if (k < Math.floor((num - half) / 2)) {
          addPlayer("black", "guesser", nameCurr);
        } else {
          addPlayer("black", "explainer", nameCurr);
        }
      }
    }
