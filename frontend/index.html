<head>

</head>
<body>
  <button id="redBtn">RED WIN</button>
  <p id="scoresRed"></p>

  <button id="blackBtn">BLACK WIN</button>
  <p id="scoresBlack"></p>

  <button id="resetBtn">RESET</button>
  <p id="scoresReset"></p>

  <!--<button id="pickBtn" onclick="chooseGamemode()">4 player</button>-->
  <!--<p id = "4playerText"></p>-->

  <head>
    <meta charset="utf-8">
    <title>Square Game</title>
  </head>
  <body>
    <!-- Step 1: ask how many players -->
    <input type="number" id="numPlayers" placeholder="Enter number of players">
    <button onclick="setupPlayerInputs()">Set Players</button>
  
    <!-- Step 2: dynamic input fields will go here -->
    <div id="playerInputs"></div>
    <button id="submitPlayers" style="display:none;" onclick="askQuestions()">Submit Players</button>
<p id="output"></p>

  <script>
    color = ""; 
    function clickButton(color){
      if (color === "red"){
        document.getElementById("redBtn").addEventListener("click", () => {
        updateScores(color); 
        display(color);
        });
      }
      else if (color === "black"){
        document.getElementById("blackBtn").addEventListener("click", () => {
        updateScores(color);
        display(color);
        });
      }
      else{
        document.getElementById("resetBtn").addEventListener("click", () => {
        updateScores(color);
        display(color);
        });
      }
    }

function updateScores(color) {
  if (color === "red") {
    players.red.forEach(p => p.score += 5);
    display("red");
  } else if (color === "black") {
    players.black.forEach(p => p.score += 5);
    display("black");
  } else if (color === "reset") {
    players.red.forEach(p => p.score = 0);
    players.black.forEach(p => p.score = 0);
    display("red");
    display("black");
  }
}


function display(color) {
  const container = color === "red"
    ? document.getElementById("scoresRed")
    : color === "black"
      ? document.getElementById("scoresBlack")
      : null;

  if (!container) return; // bail if color invalid

  container.innerHTML = ""; // clear

  const team = players[color];
  if (!Array.isArray(team)) return;

  team.forEach((player, index) => {
    const p = document.createElement("p");
    p.id = `${color}-player-${index}`;
    p.textContent = `${color} ${player.role} ${player.name}: ${player.score}`;
    container.appendChild(p);
  });
}

    let num = 0;

    function setupPlayerInputs() {
      num = parseInt(document.getElementById("numPlayers").value, 10);
      if (isNaN(num) || num < 2) {
        alert("Please enter a valid number of players (at least 2).");
        return;
      }

      const container = document.getElementById("playerInputs");
      container.innerHTML = ""; // clear previous inputs

      // create input fields
      for (let i = 0; i < num; i++) {
        const input = document.createElement("input");
        input.type = "text";
        input.id = "player" + i;
        input.placeholder = "Enter name for player " + (i + 1);
        container.appendChild(input);
        container.appendChild(document.createElement("br"));
      }

      // show submit button
      document.getElementById("submitPlayers").style.display = "inline-block";
    }

    function askQuestions() {
      let half = Math.floor(num / 2); // integer division

      for (let i = 0; i < half; i++) {
        const nameCurr = document.getElementById("player" + i).value.trim();
        if (i < Math.floor(half / 2)) {
          addPlayer("red", "guesser", nameCurr);
        } else {
          addPlayer("red", "explainer", nameCurr);
        }
      }

      for (let k = 0; k < num - half; k++) {
        const nameCurr = document.getElementById("player" + (half + k)).value.trim();
        if (k < Math.floor((num - half) / 2)) {
          addPlayer("black", "guesser", nameCurr);
        } else {
          addPlayer("black", "explainer", nameCurr);
        }
      }
    }

function addPlayer(team, role, name) {
  players[team].push({
    role: role,
    name: name,
    score: 0
  });
}

  let players = {
  red: [],
  black: []
};
  
  askQuestions();     
  display("red");
  display("black");
  clickButton("red")
  clickButton("black")
  clickButton("reset")

    
  </script>
</body>
