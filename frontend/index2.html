<!DOCTYPE html>
<html>
  <head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Square Game :D</title>
  <link rel="stylesheet" href="/styles.css">

</head>
<body style="background-color:rgb(243, 134, 152);">
  <h1>Square Game Simulator</h1>
  <h2>Menu</h2>

  <pre id="out"></pre>

  <script src="/app.js"></script>

  <style>
    .default-button {
      background-color: pink;
      color: black;
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
    }

    .highlighted-button {
	    background-color: #F5278B;
    	color: black;
    	padding: 8px 15px;
    	border: none;
    	border-radius: 5px;
    	font-weight: bold;
    }

    .red-button {
      background-color: red;
      color: black;
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
    }

    .highlighted-red-button {
	    background-color: rgba(228, 7, 7, 0.525);
    	color: black;
    	padding: 8px 15px;
    	border: none;
    	border-radius: 5px;
    	font-weight: bold;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease-in-out;
    }

    .visible {
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.5s ease-in-out;
    }

  </style>
</body>
</html>
  <style>
  button {
    margin: 10px;
    padding: 20px;
    font-size:50px;
  } 
  </style>
  <div id = "play-button-container">
    
    <button class = "default-button" id="Play">Play</button>
    <button class="default-button" id="Instructions">Instructions</button>
    <button class="default-button" id="Rules">Rules</button>
    <button class="default-button" id="Stats">Stats</button>
    <button class="default-button" id="Settings">Settings</button>
    <button class="default-button" id="Previous">Previous</button>
    <button class="default-button" id="Next">Next</button>
  </div>

  <script>
    const playButton = document.getElementById('Play');
      playButton.addEventListener('click', () => {
        window.location.href = "http://127.0.0.1:5000"; // or your URL
      });
    const Instructions=document.getElementById('Instructions');
    const Rules = document.getElementById('Rules');
    const Play = document.getElementById('Play');
    const heading1=document.querySelector('h1');
    const heading2=document.querySelector('h2');
    const nextInstruction = document.getElementById('Next');
    const prevInstruction = document.getElementById('Previous');
    nextInstruction.classList.add('hidden');
    prevInstruction.classList.add('hidden');
function displayInstructions(){
  const instr1 = document.createElement('span');
  const instrList=['First put in your group size',
                'Put in all the names of the people playing',
                'Once you have all your players in, you will be separated into two teams(don\'t worry these teams will change)',
                'You and the person on your team will be racing against the guesser and explainer on the opposing team',
                'Choose a mode: timed or manual (timed not functional yet)',
                'Choose a difficulty, get ready, and generate word',
                'Start explaining!',
                ' '
                ];

  instr1.id = 'instr1';
  //instr1.textContent = 'First put in your group size and put in all the names of the people playing - Once you got all your players in you will be seperated in to two teams = You can then select the difficulty to play, the harder the difficulty the harder the words are to guess - After you select the difficulty you can press the start game button to start the game - The two teams will compete to guess the word with their teammates help(If agreeded on by both teams you can skip a word) - Whichever team guesses the word correctly first gets a point that you can assign by the button corresponding to your team located on the right hand side of the screen(you can see which team your on by your name on the left hand side) - You can keep on playing however long you want - After each point the teams switch creating new teams for each word - Once you are done you can press the end game button and the person with the most points wins - You get one point for each time your team guesses a correct word - Good luck and have fun playing';
  instr1.style.position = 'absolute';
  instr1.style.top = '50%';
  instr1.style.fontSize='40px';
  instr1.style.transition = 'all 0.5s ease';

  document.body.appendChild(instr1);

  const screenWidth=window.innerWidth;
  const elementWidth = instr1.offsetWidth;
  instr1.style.left = '50%';
  instr1.style.transform = 'translate(-50%, -50%)';

  let i=0;
  nextInstruction.addEventListener('click', ()=>{
    showNextInstruction();
  });
  prevInstruction.addEventListener('click', ()=>{
    i-=2;
    showNextInstruction();
  });
    function showNextInstruction(){
      if (i < instrList.length) {
        nextInstruction.disabled = false;
        instr1.style.opacity=0;
        instr1.textContent=instrList[i];
        instr1.style.opacity=1;
        i++;
      }
      else {
        nextInstruction.disabled = true;
      }
    }
    showNextInstruction();
}

function showRules() {
  const ruleList = document.createElement('span');
  ruleList.id = 'ruleList';
  ruleList.textContent = '1: No direct antonyms, so you cannot say "not sad" when the word is "happy"\n 2: No hand gestures/charades\n 3: Roles/Teams will rotate clockwise, so enter the players clockwise from the first player entered\n 4: For longer/more difficult words, you can break them up into parts; for example, if the word is "groundbreaking," you can give a clue for "ground" and a separate clue for "breaking". However, you cannot say any part of the word in your clues';
  ruleList.style.whiteSpace = 'pre-line';
  ruleList.style.position = 'absolute';
  ruleList.style.top = '30%';
  ruleList.style.fontSize = '30px';
  ruleList.style.transition = 'all 0.5s ease';
  
  document.body.appendChild(ruleList);
}



Instructions.addEventListener('click',()=>{
  Instructions.style.display='none';
  heading1.style.display='none';
  heading2.style.display='none';
  displayInstructions();
  playButton.style.top='200px';
  playButton.style.left='50px';
  nextInstruction.classList.remove('hidden');
  prevInstruction.classList.remove('hidden');
  nextInstruction.classList.add('visible');
  prevInstruction.classList.add('visible');
})

Rules.addEventListener('click', ()=>{
  Rules.style.display='none';
  heading1.style.display='none';
  heading2.style.display='none';
  showRules();
  playButton.style.top='200px';
  playButton.style.left='50px';
})
  </script>
</script>
</body>

</html>
